<svg viewBox="0 0 240 120" xmlns="http://www.w3.org/2000/svg" style="background:black">
  <defs>
    <pattern id="hex" width="12" height="10.4" patternUnits="userSpaceOnUse">
      <polygon points="6,1 10,3.2 10,7.2 6,9.4 2,7.2 2,3.2"
               fill="none"
               stroke="white"
               stroke-opacity="0.22"
               stroke-width="0.6"/>
    </pattern>

    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="100%" stop-color="white" stop-opacity="1"/>
    </linearGradient>

    <mask id="mask">
      <rect width="100%" height="100%" fill="url(#fade)" />
    </mask>
  </defs>

  <rect width="100%" height="100%" fill="url(#hex)" mask="url(#mask)" />
</svg>